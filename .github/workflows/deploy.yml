name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: npx -y @marp-team/marp-cli@4 --theme-set slides/themes --input-dir slides --output docs/slides --html --allow-local-files
      - run: mkdocs gh-deploy --force
